[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:registry]
command=/bin/registry serve /etc/docker/registry/config.yml
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/registry.err.log
stdout_logfile=/var/log/supervisor/registry.out.log
environment=REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY="/var/lib/registry"

[program:webhook-receiver]
command=python3 /app/webhook_receiver.py
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/webhook.err.log
stdout_logfile=/var/log/supervisor/webhook.out.log
environment=REGISTRY="127.0.0.1:5000",WEBHOOK_PORT="5001",UPDATE_STRATEGY="recreate"

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface