services:
  registry-combined:
    build:
      context: .
      dockerfile: Dockerfile.combined
    # image: ghcr.io/hnrobert/hooky-registry/combined:latest
    container_name: registry-combined
    restart: unless-stopped
    environment:
      - REGISTRY=127.0.0.1:5000
      - WEBHOOK_PORT=5001
      - UPDATE_STRATEGY=recreate # Options: 'recreate' or 'restart'
    ports:
      - '5000:5000' # Registry
      - '5001:5001' # Webhook receiver
    volumes:
      - registry-data:/var/lib/registry
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mach-network
    healthcheck:
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  registry-data:

networks:
  mach-network:
    external: true
