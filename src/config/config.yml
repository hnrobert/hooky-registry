version: 0.1
log:
  level: warn
  fields:
    service: registry

http:
  addr: :5000

storage:
  filesystem:
    rootdirectory: /var/lib/registry

notifications:
  endpoints:
    - name: registry-webhook
      url: http://127.0.0.1:5001/notifications
      timeout: 30s
      threshold: 3
      backoff: 5s
